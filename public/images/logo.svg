<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40">
  <defs>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- D20 icon — 40×40 area, center (20,20), outer radius 17 -->
  <!-- Outer pentagon: top(20,3) upper-right(36,15) lower-right(30,34) lower-left(10,34) upper-left(4,15) -->
  <polygon points="20,3 36,15 30,34 10,34 4,15"
    fill="url(#face)" stroke="#4c1d95" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Inner pentagon (rotated 36°): (24,14) (27,22) (20,27) (13,22) (16,14) -->
  <polygon points="24,14 27,22 20,27 13,22 16,14"
    fill="none" stroke="#1e0a3c" stroke-width="1"/>

  <!-- Outer-to-inner lines -->
  <line x1="20" y1="3"  x2="24" y2="14" stroke="#1e0a3c" stroke-width="0.9"/>
  <line x1="20" y1="3"  x2="16" y2="14" stroke="#1e0a3c" stroke-width="0.9"/>
  <line x1="36" y1="15" x2="24" y2="14" stroke="#1e0a3c" stroke-width="0.9"/>
  <line x1="36" y1="15" x2="27" y2="22" stroke="#1e0a3c" stroke-width="0.9"/>
  <line x1="30" y1="34" x2="27" y2="22" stroke="#1e0a3c" stroke-width="0.9"/>
  <line x1="30" y1="34" x2="20" y2="27" stroke="#1e0a3c" stroke-width="0.9"/>
  <line x1="10" y1="34" x2="20" y2="27" stroke="#1e0a3c" stroke-width="0.9"/>
  <line x1="10" y1="34" x2="13" y2="22" stroke="#1e0a3c" stroke-width="0.9"/>
  <line x1="4"  y1="15" x2="13" y2="22" stroke="#1e0a3c" stroke-width="0.9"/>
  <line x1="4"  y1="15" x2="16" y2="14" stroke="#1e0a3c" stroke-width="0.9"/>

  <!-- "20" -->
  <text x="20" y="21"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="8" font-weight="bold"
    fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">20</text>

  <!-- DUNGEONS text -->
  <text x="46" y="26"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22" font-weight="bold"
    letter-spacing="2"
    fill="url(#gold)">DUNGEONS</text>

  <!-- Thin accent line below text -->
  <line x1="46" y1="31" x2="198" y2="31" stroke="#6d28d9" stroke-width="0.8" opacity="0.6"/>
</svg>
